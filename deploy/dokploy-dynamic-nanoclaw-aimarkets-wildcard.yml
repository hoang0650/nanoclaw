# Dokploy → dynamic/nanoclaw-aimarkets-wildcard.yml
# DNS: nanoclaw + *.nanoclaw A → 72.62.72.165
# TLS pattern = same as ai.aimarkets.vn (denglish): web+websecure, LE HTTP-01
# Tenant hosts: {userId}.nanoclaw.aimarkets.vn (24-hex MongoId)

http:
  routers:
    nanoclaw-aimarkets-shared-http:
      rule: "Host(`nanoclaw.aimarkets.vn`)"
      entryPoints:
        - web
      middlewares:
        - redirect-to-https
      service: nanoclaw-aimarkets-svc
      priority: 200

    nanoclaw-aimarkets-shared-https:
      rule: "Host(`nanoclaw.aimarkets.vn`)"
      entryPoints:
        - websecure
      service: nanoclaw-aimarkets-svc
      priority: 200
      tls:
        certResolver: letsencrypt
        domains:
          - main: "nanoclaw.aimarkets.vn"

    nanoclaw-aimarkets-tenant-http:
      rule: "HostRegexp(`^[a-f0-9]{24}\\.nanoclaw\\.aimarkets\\.vn$`)"
      entryPoints:
        - web
      middlewares:
        - redirect-to-https
      service: nanoclaw-aimarkets-svc
      priority: 50

    nanoclaw-aimarkets-tenant-https:
      rule: "HostRegexp(`^[a-f0-9]{24}\\.nanoclaw\\.aimarkets\\.vn$`)"
      entryPoints:
        - websecure
      service: nanoclaw-aimarkets-svc
      priority: 50
      tls:
        certResolver: letsencrypt

  services:
    nanoclaw-aimarkets-svc:
      loadBalancer:
        servers:
          - url: "http://aimarketplace-nanoclaw-hsnvyh:3100"
        passHostHeader: true
