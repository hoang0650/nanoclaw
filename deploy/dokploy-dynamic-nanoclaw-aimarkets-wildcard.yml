# Optional — only if NOT using ProxVN (https://proxvn.phgrouptechs.com/).
# Preferred: expose NanoClaw via ProxVN HTTP tunnel (*.bacsycay.click), see DOKPLOY-AIMARKETS.md.
#
# Dokploy → Traefik File System → dynamic/nanoclaw-aimarkets-wildcard.yml
#
# DNS: nanoclaw + *.nanoclaw  A → 72.62.72.165
# Upstream: aimarkets-proxy :3200 OR dashboard :3100

http:
  routers:
    nanoclaw-aimarkets-wildcard-https:
      rule: "HostRegexp(`^[a-f0-9]{24}\\.nanoclaw\\.aimarkets\\.vn$`)"
      entryPoints:
        - websecure
      service: nanoclaw-aimarkets-svc
      tls:
        certResolver: letsencrypt
      priority: 50

    nanoclaw-aimarkets-shared-https:
      rule: "Host(`nanoclaw.aimarkets.vn`)"
      entryPoints:
        - websecure
      service: nanoclaw-aimarkets-svc
      tls:
        certResolver: letsencrypt
      priority: 200

  services:
    nanoclaw-aimarkets-svc:
      loadBalancer:
        servers:
          - url: "http://aimarketplace-nanoclaw:3200"
        passHostHeader: true
