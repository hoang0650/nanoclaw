# Aimarkets NanoClaw mức 2 — full host + Docker socket + persistent data.
# Dokploy: Compose mode, or mirror mounts/env onto Dockerfile.level2 app.
# Docs: deploy/DOKPLOY-LEVEL2.md

services:
  nanoclaw:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.level2
    ports:
      - "3100:3100"
    environment:
      NODE_ENV: production
      DASHBOARD_PORT: "3100"
      DASHBOARD_HOST: "0.0.0.0"
      DASHBOARD_SECRET: ${DASHBOARD_SECRET:?set DASHBOARD_SECRET}
      PONYTAIL_URL: ${PONYTAIL_URL:-}
      PONYTAIL_MODE: ${PONYTAIL_MODE:-compact}
      # Buyer BYOK provider (aimarkets.vn → Agents → NanoClaw → AI provider).
      AIMARKETS_API_URL: ${AIMARKETS_API_URL:-https://api.aimarkets.vn}
      AIMARKETS_SERVICE_SECRET: ${AIMARKETS_SERVICE_SECRET:-}
      NANOCLAW_INSTALL_ID: aimarkets
      # Same path on the VPS and in the container: agents are spawned by the host daemon.
      NANOCLAW_RUNTIME_ROOT: /opt/nanoclaw-aimarkets
    volumes:
      - nanoclaw-data:/app/data
      - /opt/nanoclaw-aimarkets:/opt/nanoclaw-aimarkets
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  nanoclaw-data:
