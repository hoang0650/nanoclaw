name: Docker image (Dokploy)

# Builds the linux/amd64 Aimarkets images on GitHub runners and pushes them to GHCR
# so the Dokploy VPS only pulls prebuilt images:
#   nanoclaw-aimarkets        host + dashboard + login proxy (deploy/Dockerfile.level2)
#   nanoclaw-agent-aimarkets  per-session agent image (container/Dockerfile); the host
#                             pulls it through docker.sock instead of building it there.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: docker-dokploy-${{ github.ref }}
  cancel-in-progress: true

env:
  HOST_IMAGE: ghcr.io/${{ github.repository_owner }}/nanoclaw-aimarkets
  AGENT_IMAGE: ghcr.io/${{ github.repository_owner }}/nanoclaw-agent-aimarkets

jobs:
  agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (lowercase)
        id: meta
        run: |
          echo "image=$(echo '${{ env.AGENT_IMAGE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "sha=$(echo $GITHUB_SHA | head -c 7)" >> "$GITHUB_OUTPUT"
          # Same label container/build.sh stamps; container/pull.sh checks it.
          echo "lock=$(sha256sum container/agent-runner/bun.lock | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: container
          file: container/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            AGENT_RUNNER_LOCK_SHA256=${{ steps.meta.outputs.lock }}
            IMAGE_SOURCE=ghcr
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=dokploy-agent-amd64
          cache-to: type=gha,mode=max,scope=dokploy-agent-amd64

  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image names (lowercase)
        id: meta
        run: |
          echo "image=$(echo '${{ env.HOST_IMAGE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "agent=$(echo '${{ env.AGENT_IMAGE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "sha=$(echo $GITHUB_SHA | head -c 7)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.level2
          platforms: linux/amd64
          push: true
          # Agent image from the same commit: its baked node_modules match the
          # agent-runner src the host mounts.
          build-args: |
            NANOCLAW_AGENT_IMAGE_REF=${{ steps.meta.outputs.agent }}:sha-${{ steps.meta.outputs.sha }}
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=dokploy-amd64
          cache-to: type=gha,mode=max,scope=dokploy-amd64

  redeploy:
    needs: [agent, host]
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger Dokploy redeploy
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        if: env.DOKPLOY_WEBHOOK_URL != ''
        run: curl -fsS -X POST "$DOKPLOY_WEBHOOK_URL" || echo "::warning::Dokploy webhook failed; redeploy manually in Dokploy."
